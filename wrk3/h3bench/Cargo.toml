[package]
name = "h3bench"
version = "0.1.0"
edition = "2021"

[dependencies]
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "0.26"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
sketches-ddsketch = "0.2"
http = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
